name: Code Quality

on:
  push:
    branches: [ main, "claude/**", "feature/**", "bugfix/**" ]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 mypy

    - name: Lint with flake8
      run: |
        # Critical errors only
        flake8 src/bookmark_downloader tests/ --count --select=E9,F63,F7,F82 --show-source
        # All issues with exit-zero
        flake8 src/bookmark_downloader tests/ --max-line-length=100 --exit-zero --statistics || true
      continue-on-error: true

    - name: Type check with mypy
      run: |
        mypy src/bookmark_downloader --ignore-missing-imports || true
      continue-on-error: true
