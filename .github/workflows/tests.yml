name: Tests

on:
  push:
    branches: [ main, "claude/**", "feature/**", "bugfix/**" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Run tests with pytest
      run: |
        PYTHONPATH=src pytest tests/ -v --cov=src/bookmark_downloader --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
      continue-on-error: true

    - name: Generate coverage report
      run: |
        PYTHONPATH=src pytest tests/ --cov=src/bookmark_downloader --cov-report=html
      if: always()

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-py${{ matrix.python-version }}
        path: htmlcov/
      if: always()

  test-summary:
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
    - name: Test Results Summary
      run: |
        echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ "${{ needs.test.result }}" == "success" ]; then
          echo "✅ **All tests passed!**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Python 3.9 ✓" >> $GITHUB_STEP_SUMMARY
          echo "- Python 3.10 ✓" >> $GITHUB_STEP_SUMMARY
          echo "- Python 3.11 ✓" >> $GITHUB_STEP_SUMMARY
          echo "- Python 3.12 ✓" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Tests failed - please review logs above**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the test output above for details on which tests failed." >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

